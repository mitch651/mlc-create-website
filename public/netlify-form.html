<!DOCTYPE html>
<html>
  <head><title>Netlify Form Detection</title></head>
  <body>
    <!-- Hidden form for Netlify build-time detection (Next.js client components aren't scanned) -->
    <form name="contact" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="businessName" />
      <input name="contactName" />
      <input name="titleRole" />
      <input name="phone" />
      <input name="email" />
      <input name="businessAddress" />
      <input name="currentWebsite" />
      <input name="industry" />
      <input name="selectedPackage" />
      <input name="desiredLaunchDate" />
      <textarea name="mainGoals"></textarea>
      <textarea name="branding"></textarea>
      <input name="features" />
      <input name="contentSupply" />
      <input name="inspiration1" />
      <input name="inspiration2" />
      <input name="inspiration3" />
      <textarea name="additionalNotes"></textarea>
    </form>
  </body>
</html>
